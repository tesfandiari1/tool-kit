[package]
name = "tool-kit-worker-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.97"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

# Copied verbatim from backend/Cargo.toml [lints]. There is no root workspace
# to share them from, so all three crates carry their own copy.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"
empty_drop = "deny"
fn_to_numeric_cast_any = "deny"
rest_pat_in_fully_bound_structs = "deny"
unused_async = "deny"
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
let_underscore_future = "deny"
manual_async_fn = "deny"
lossy_float_literal = "deny"
string_slice = "deny"
match_wildcard_for_single_variants = "deny"
