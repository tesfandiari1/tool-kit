name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/converter
      - run: cargo clippy --locked --manifest-path crates/worker-protocol/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path crates/worker-protocol/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/converter/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/converter/Cargo.toml

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # tauri-build resolves bundle.externalBin and bundle.resources in the
      # build script, so cargo clippy/test fail with ResourcePathNotFound
      # without them. Both are gitignored, so a fresh checkout has neither.
      # ponytail: empty placeholders satisfy the existence probe, which is all
      # this job needs. It compiles and unit-tests, it never bundles. Anything
      # that bundles or runs the sidecar must run `pnpm sidecars` for real.
      # The names come from tauri.conf.json, so a new sidecar or resource
      # cannot break this job again. A resource path with a dot is a file,
      # any other is a folder.
      - name: Stage placeholder sidecar artifacts
        working-directory: apps/desktop/src-tauri
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          for bin in $(jq -r '.bundle.externalBin[]' tauri.conf.json); do
            mkdir -p "$(dirname "$bin")"
            touch "$bin-$triple"
          done
          for res in $(jq -r '.bundle.resources | keys[]' tauri.conf.json); do
            [ -e "$res" ] && continue
            case "$(basename "$res")" in
              *.*) mkdir -p "$(dirname "$res")" && touch "$res" ;;
              *) mkdir -p "$res" ;;
            esac
          done
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

  # The RustSec advisory database moves without us, so this job can go red on a
  # commit that changed nothing. That is the job working. It is separate from
  # the build jobs so a new advisory never reads as a broken build.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      # Pinned, and run as the same two commands `pnpm verify:deps` runs.
      # cargo-deny-action would be shorter, but it defaults to --all-features
      # and to its own Rust version, so CI would grade a different crate graph
      # than the one a developer sees.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --manifest-path apps/converter/Cargo.toml check
      - run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check
      - run: cargo deny --manifest-path crates/worker-protocol/Cargo.toml check
