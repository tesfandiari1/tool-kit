[package]
name = "tool-kit"
version = "1.0.0"
description = "macOS menu-bar app that turns files into AI-ready text"
authors = ["Tristin Esfandiari"]
edition = "2021"
license = "MIT"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tool_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
# Direct, for the zero-copy upload buffer in providers.rs. Already in the
# lockfile through reqwest.
bytes = "1"
tokio = { version = "1", features = ["time", "fs", "io-util", "sync"] }
# Direct, for the data protection keychain in secrets.rs. OSX_10_15 is not a
# default feature and gates PasswordOptions::use_protected_keychain.
security-framework = { version = "3", features = ["OSX_10_15"] }
mime_guess = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Keep in sync with backend/Cargo.toml [lints]. No root workspace.
# Default Clippy groups stay warn; CI and pnpm verify pass -D warnings.
# This table is the extra deny-set for LLM/vibe-code failure modes.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"
empty_drop = "deny"
fn_to_numeric_cast_any = "deny"
rest_pat_in_fully_bound_structs = "deny"
unused_async = "deny"
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
let_underscore_future = "deny"
manual_async_fn = "deny"
lossy_float_literal = "deny"
string_slice = "deny"
match_wildcard_for_single_variants = "deny"
