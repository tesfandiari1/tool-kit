name: tool-kit-converter

services:
  converter:
    build:
      context: .
    image: tool-kit-converter:dev
    restart: unless-stopped
    init: true
    # Docker's default is a 10s wait between SIGTERM and SIGKILL, but
    # TOOLKIT_CONVERTER_SHUTDOWN_GRACE_SECS is 30, so the default kills the
    # service 20s before it may finish draining. Every stop would then look
    # like a crash and leave an interrupted job for startup recovery.
    stop_grace_period: 45s
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The root filesystem is read-only, but the PDF worker calls
    # `tempfile::tempfile()`, so it still needs a writable /tmp.
    tmpfs:
      - /tmp:size=384m,mode=1777,noexec,nosuid,nodev
    # To keep the data root on the host instead, swap the named volume for a
    # bind mount to a directory outside the repo:
    #   volumes:
    #     - /srv/tool-kit/data:/data
    # That directory must sit on a local disk and must never be an SMB or NFS
    # mount. SQLite WAL locking is same-host only, and a network filesystem
    # corrupts the database. A bind mount also keeps the host directory's owner
    # and mode, so create it as 10001:10001 with mode 0700 before the first run.
    # The named volume below inherits both from the image.
    volumes:
      - converter-data:/data
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    environment:
      TOOLKIT_CONVERTER_BIND_ADDR: 0.0.0.0:8080
      TOOLKIT_CONVERTER_DATA_DIR: /data
      TOOLKIT_CONVERTER_TOKEN_FILE: /run/secrets/bootstrap_token
      TOOLKIT_CONVERTER_MAX_JOBS: 4
      TOOLKIT_CONVERTER_MAX_CONCURRENT_UPLOADS: 2
      RUST_LOG: ${RUST_LOG:-tool_kit_converter=info}
    secrets:
      - bootstrap_token
    ports:
      - "127.0.0.1:${TOOLKIT_CONVERTER_PORT:-8080}:8080"
    # Mirrors the image HEALTHCHECK so `docker compose config` shows the real
    # values. The start period covers migrations and startup job recovery.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  converter-data:

secrets:
  bootstrap_token:
    file: ${TOOLKIT_CONVERTER_TOKEN_FILE:-./secrets/bootstrap-token.txt}
