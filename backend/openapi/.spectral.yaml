# Spectral ruleset for the conversion contract, run by `pnpm lint:api`.
#
# The suite is Stoplight's `spectral:oas`, roughly sixty rules nobody here
# wrote: structural validity, unresolved and unused components, duplicate
# operation ids, path parameters declared but never defined, examples that do
# not match their own schema. It runs at --fail-severity=warn, so the list
# below is the complete set of rules this contract is allowed to break.
#
#   pnpm lint:api

extends: ["spectral:oas"]

rules:
  # Every operation already carries a `summary`. `description` on top of it
  # would be the same sentence twice on all eight, which is padding.
  operation-description: "off"

  # Tags group operations in generated documentation. Eight operations on one
  # loopback service do not need grouping, and inventing categories to satisfy
  # a linter puts fiction in the contract.
  operation-tags: "off"

  # No contact to name. The service is loopback-only and single-author.
  info-contact: "off"

overrides:
  # `array-items` predates OpenAPI 3.1, which resolves schemas as JSON Schema
  # 2020-12. Both arrays below are tuples: `prefixItems` fixes each position
  # and `maxItems` equals the prefix length, so no element can exist that
  # `items` would describe. `openapi-typescript` reads them correctly and
  # `schema.ts` carries the literal member types.
  #
  # Scoped to these two rather than turned off, so a genuinely untyped array
  # added later still fails.
  - files:
      - "**/openapi.yaml#/components/schemas/ConversionCapabilities/properties/inputFormats"
      - "**/openapi.yaml#/components/schemas/ConversionCapabilities/properties/engines"
    rules:
      array-items: "off"
