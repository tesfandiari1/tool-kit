# Supply-chain gate for the desktop app, run by `pnpm verify:deps`.
#
# See `apps/converter/deny.toml` for what this gate is and why each crate carries its
# own copy. There is no root workspace, so the two files never merge.
#
#   cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check

[graph]
# macOS is the only target the app ships for, and naming it here is what makes
# this gate honest. Tauri's Linux stack (GTK3, webkit2gtk) sits in Cargo.lock
# and carries ten unmaintained advisories, none of which link into a macOS
# build. Ignoring them by id would hide the day one of them turns into a real
# vulnerability on a platform we do ship. Filtering the graph does not.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = false

[advisories]
yanked = "deny"
# A vulnerability always fails. So does an unmaintained crate, until someone
# writes down why it is tolerated.
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range, transitive through Tauri. Unicode table lookups over data the app does not choose. Upstream Tauri tracks the move off unic." },
  { id = "RUSTSEC-2025-0080", reason = "unic-common, same tree and same reason as RUSTSEC-2025-0075." },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property, same tree and same reason as RUSTSEC-2025-0075." },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, same tree and same reason as RUSTSEC-2025-0075." },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, same tree and same reason as RUSTSEC-2025-0075." },
]

[licenses]
# Permissive only, and every entry is a license actually present in Cargo.lock.
# MPL-2.0 is here because Servo's CSS crates reach the tree through wry. It is
# file-level copyleft, satisfied by shipping those files unmodified, which a
# dependency always is.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
# See apps/converter/deny.toml. Fifteen duplicates here, all of them Tauri's, none
# actionable from this crate.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
