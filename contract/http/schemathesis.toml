# Schemathesis configuration for the conversion contract, run by
# `apps/converter/scripts/contract-fuzz.sh`.
#
# The suite is generated from `openapi.yaml`. Nothing here lists a case to try:
# Schemathesis derives them from the schema and asserts that responses match
# the contract. That independence is the point, because the hand-written
# `tests/http_contract.rs` was written by whoever wrote the handlers and can
# only check what its author already believed.

# The id the four id-scoped operations are tested against. The script runs the
# whole suite twice and sets this variable differently each time, because one
# value cannot cover both halves of those operations:
#
#   present  a conversion the script seeded and polled to succeeded, so the
#            200 responses and the schemas they carry are actually reached
#   absent   a UUID no conversion has, so the 404 responses are reached
#
# One pass alone is a hole either way, and the hole is invisible: pinning a
# real id turned an undeclared 404 into a green run when this was tested.
#
# A missing variable is a hard config error inside Schemathesis, which is what
# stops a broken seed step from quietly downgrading the run.
[parameters]
"path.id" = "${TOOLKIT_FUZZ_SEED_ID}"

[[operations]]
include-operation-id = "createConversion"
# A fuzzer cannot submit an acceptable document. Admission requires the bytes
# to open with the container signature of the format the filename claims
# (`invalid_source_signature`), and generated bytes never do, so "valid data
# was rejected" is true of every case here and says nothing.
#
# Scoped to this one operation. Every other check still runs on the POST, and
# `positive_data_acceptance` still guards the other seven operations.
checks.positive_data_acceptance.enabled = false
