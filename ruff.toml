# Ruff config.
#
# Note: this project's app is Rust (src-tauri) + TypeScript (src). Those are
# linted by `cargo clippy` and `pnpm lint` (ESLint) respectively — ruff does
# not lint them. This config governs any Python helper/automation scripts you
# add to the repo, and is intentionally strict to catch sloppy generated code.

target-version = "py312"
line-length = 100

[lint]
# Everything, then peel back only what fights the formatter or is pure noise.
select = ["ALL"]
ignore = [
  "D",       # docstring presence/format — too noisy for small scripts
  "COM812",  # trailing-comma — defer to the formatter
  "ISC001",  # implicit-str-concat — conflicts with the formatter
]

[format]
quote-style = "double"
indent-style = "space"
